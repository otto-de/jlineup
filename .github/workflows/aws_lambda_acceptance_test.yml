name: AWS Lambda Acceptance Tests

on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: Git Ref (Optional)
        required: false
#  push:
#    branches: [ main ]
#    paths-ignore:
#      - '**/README.md'
#      - '**/HISTORY.md'
#      - 'docs/**'
#  schedule:
#    - cron: '0 9 * * *'

concurrency:
  group: aws-lambda-acceptance-test
  cancel-in-progress: false

permissions: # added using https://github.com/step-security/secure-repo
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Install dependencies (incl. AWS CDK)
        run: pnpm install
      - name: Add node_modules/.bin to PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> $GITHUB_PATH
      - name: AWS Lambda acceptance tests
        id: acceptance
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          JLINEUP_LAMBDA_ACCEPTANCE_TEST_ENABLED: true
          JLINEUP_LAMBDA_ACCEPTANCE_FORCE_DEPLOY: true
          AWS_REGION: eu-central-1
          AWS_DEFAULT_REGION: eu-central-1
        run: |
          ./gradlew build assemble -x test
          ./gradlew :jlineup-lambda:test --tests '*LambdaAcceptanceTest*'
          JLINEUP_LAMBDA_ACCEPTANCE_FORCE_DEPLOY=false ./gradlew :jlineup-cli-lambda:test --tests '*CliLambdaAcceptanceTest*'

      # The native jlineup-cli-lambda binary needs reachability metadata from real Lambda runs, which can
      # only be traced here. The binary is first tested with the committed metadata (as it would be
      # released), then the metadata is traced again and uploaded, so changes can be committed.
      - name: Set up mise
        if: ${{ always() && steps.acceptance.outcome == 'success' }}
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: false

      - name: Read Lambda function name of the acceptance test stack
        id: lambda
        if: ${{ always() && steps.acceptance.outcome == 'success' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-central-1
          AWS_DEFAULT_REGION: eu-central-1
        run: |
          FUNCTION_NAME=$(aws cloudformation describe-stacks --stack-name jlineup-lambda-acc-test \
            --query "Stacks[0].Outputs[?OutputKey=='FunctionName'].OutputValue" --output text)
          echo "Lambda function: ${FUNCTION_NAME}"
          echo "function-name=${FUNCTION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Native jlineup-cli-lambda acceptance test
        if: ${{ always() && steps.lambda.outcome == 'success' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-central-1
          AWS_DEFAULT_REGION: eu-central-1
          FUNCTION_NAME: ${{ steps.lambda.outputs.function-name }}
        run: |
          cli/graalvm/build-native-image.sh cli-lambda
          JLINEUP=cli-lambda/build/native/jlineup-cli-lambda-linux-amd64/jlineup
          ARGS=(--working-dir "$RUNNER_TEMP/native"
                --config cli-lambda/src/test/resources/acceptance/acceptance_cli_lambda.lineup.json
                -F "$FUNCTION_NAME" -L "$AWS_REGION")
          "$JLINEUP" "${ARGS[@]}" --step before
          "$JLINEUP" "${ARGS[@]}" --step after
          test -f "$RUNNER_TEMP/native/report/report.json"

      - name: Trace native image metadata of jlineup-cli-lambda
        id: trace
        if: ${{ always() && steps.lambda.outcome == 'success' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-central-1
          AWS_DEFAULT_REGION: eu-central-1
          JLINEUP_LAMBDA_FUNCTION_NAME: ${{ steps.lambda.outputs.function-name }}
          JLINEUP_LAMBDA_AWS_REGION: eu-central-1
        run: |
          cli/graalvm/prepare-native-image-build.sh cli-lambda
          if git diff --quiet -- cli-lambda/graalvm; then
            echo "Native image metadata of jlineup-cli-lambda is up to date." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Native image metadata of jlineup-cli-lambda changed, commit cli-lambda/graalvm/reachability-metadata.json from the artifact."
            echo "Native image metadata of jlineup-cli-lambda changed, see the artifact cli-lambda-reachability-metadata." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload native image metadata of jlineup-cli-lambda
        if: ${{ always() && steps.trace.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-lambda-reachability-metadata
          path: cli-lambda/graalvm/reachability-metadata.json

      # The Lambda container images are pushed into the CDK bootstrap ECR repository
      # (cdk-hnb659fds-container-assets-<account>-<region>), which is NOT part of the
      # acceptance test stack. Neither `cdk destroy` nor the stack's removal policies
      # ever clean it up, so every image we ever pushed would accumulate there forever
      # at multiple GB a piece.
      #
      # `cdk gc` resolves the templates of all deployed stacks in the environment,
      # collects the asset hashes they reference and deletes only the images that are
      # no longer referenced. The image used by the currently deployed
      # 'jlineup-lambda-acc-test' stack is therefore always retained, so this is safe
      # to run while the stack is alive.
      - name: Garbage collect unreferenced CDK container images in ECR
        if: always()
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-central-1
          AWS_DEFAULT_REGION: eu-central-1
        run: |
          cdk gc "aws://${AWS_ACCOUNT_ID}/${AWS_REGION}" \
            --unstable=gc \
            --type=ecr \
            --action=full \
            --confirm=false \
            --created-buffer-days=0 \
            --rollback-buffer-days=0
